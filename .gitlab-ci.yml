# Lean CI for active development (saves GitLab shared-runner minutes).
# Docs / compose / markdown checks run locally:
#   ./scripts/validate.sh
# Full pipeline: `.gitlab-ci.full.yml`
# Enable full: CI/CD variable CI_PIPELINE_MODE=full
# Docs: tourism-platform/docs/ci-and-runners.md

include:
  - local: ".gitlab-ci.full.yml"
    rules:
      - if: '$CI_PIPELINE_MODE == "full"'

workflow:
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "gamma"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - lean
  - mirror

ci-lean-notice:
  stage: lean
  image: alpine:3.21
  script:
    - echo "Lean CI — platform validate/lint is local (./scripts/validate.sh)."
    - echo "Set CI_PIPELINE_MODE=full for gitleaks + markdown/yamllint + compose checks."
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
      when: never
    - when: on_success

github-mirror:
  stage: mirror
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/ci-mirror-to-github.sh
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "gamma" && $GITHUB_MIRROR_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_TOKEN'
  needs:
    - ci-lean-notice
