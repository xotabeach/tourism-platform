name: Validate showcase

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install YAML linter
        run: python -m pip install --disable-pip-version-check yamllint==1.37.1

      - name: Validate platform foundation
        run: ./scripts/validate.sh
