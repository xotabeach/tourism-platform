name: crimeatrip-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-backend-environment: &backend-environment
  APP_ENV: test
  LOG_LEVEL: INFO
  MEDIA_ROOT: /app/data/media
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  AUTH_OTP_ACCEPT_ANY: ${AUTH_OTP_ACCEPT_ANY:-false}
  AUTH_OTP_STORE_DEBUG_CODE: ${AUTH_OTP_STORE_DEBUG_CODE:-true}
  ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
  ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-ops}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
  # Optional FCM HTTP v1. Prefer FILE (mounted secret); JSON env is also supported.
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
  FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
  # 2GIS HTTP Routing/Static API. ROUTING_PROVIDER stays "stub" until a
  # sanitized production smoke (scripts/check_two_gis_routing.py) passes.
  TWO_GIS_API_KEY: ${TWO_GIS_API_KEY:-}
  ROUTING_PROVIDER: ${ROUTING_PROVIDER:-stub}
  # AI planning. The admin runtime-config page can switch AI_PROVIDER
  # without a redeploy, but GEMINI_API_KEY can only come from here and is
  # required at startup when AI_PROVIDER=gemini and AI_PLANNING_ENABLED=true.
  AI_PLANNING_ENABLED: ${AI_PLANNING_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
  AI_MAX_REPAIR_ATTEMPTS: ${AI_MAX_REPAIR_ATTEMPTS:-1}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # Must be listed here, not only in .env: without this line the value never
  # reaches the container and the app silently falls back to the config.py
  # default. The Moscow host cannot reach Google directly (400
  # FAILED_PRECONDITION, "User location is not supported"), so it points at
  # the relay on the previous server.
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  # Same trap as GEMINI_BASE_URL: set in .env but never listed here, these
  # never reached the container. RAG_ENABLED read as false however it was
  # set, and switching AI_PROVIDER to lmstudio would have failed at startup
  # because the base URL and model were missing.
  RAG_ENABLED: ${RAG_ENABLED:-false}
  LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
  LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
  LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
  # 2GIS TSP / Distance Matrix stay "stub" until deliberately switched on.
  TSP_PROVIDER: ${TSP_PROVIDER:-stub}
  DISTANCE_MATRIX_PROVIDER: ${DISTANCE_MATRIX_PROVIDER:-stub}

services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    mem_limit: 48m
    pids_limit: 64
    environment:
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    environment: *backend-environment
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8000/health/ready", timeout=5)
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - media-data:/app/data/media
    networks:
      # private = DB/Redis (internal). edge = outbound HTTPS (FCM) + reachability
      # from Caddy without publishing host ports.
      - private
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  postgres:
    image: ${POSTGRES_IMAGE:-crimeatrip/postgis-pgvector:16-3.4}
    build:
      context: ../../docker/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 224m
    pids_limit: 100
    shm_size: 32m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    mem_limit: 48m
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 24mb
        --maxmemory-policy allkeys-lru
        --appendonly no
        --save ""
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    image: ${BACKEND_IMAGE}
    profiles:
      - tools
    mem_limit: 192m
    pids_limit: 128
    environment: *backend-environment
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  seed:
    image: ${BACKEND_IMAGE}
    profiles:
      - tools
    mem_limit: 192m
    pids_limit: 128
    environment: *backend-environment
    command:
      - python
      - scripts/seed_crimea.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  retention:
    image: ${BACKEND_IMAGE}
    profiles:
      - maintenance
    mem_limit: 192m
    pids_limit: 128
    environment: *backend-environment
    command:
      - python
      - scripts/purge_route_routing_snapshots.py
      - --apply
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Daily recommendation decks. Database-only: calls no vendor API, so it is
  # safe to run unattended on a schedule.
  recommendations:
    image: ${BACKEND_IMAGE}
    profiles:
      - maintenance
    mem_limit: 192m
    pids_limit: 128
    environment: *backend-environment
    command:
      - python
      - scripts/generate_route_recommendations.py
      - --limit
      - "200"
      - --apply
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  media-data:

networks:
  edge:
  private:
    internal: true
